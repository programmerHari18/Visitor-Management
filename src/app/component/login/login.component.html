<div
  class="bg-gray-200 min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat p-4"
>
  <div class="w-full max-w-md bg-white rounded-lg shadow-xl p-6 sm:p-8 md:p-10">
    <!-- <div class="flex justify-center mb-6">
      <img src="assets/Daikin Logo.png" alt="Daikin Logo" class="h-12" />
    </div> -->

    <h2 class="text-center text-2xl font-semibold text-gray-800 mb-6">
      Login
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <input
          type="text"
          formControlName="userName"
          placeholder="Username"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf
        ="loginForm.get('userName')?.invalid && loginForm.get('userName')?.touched" class="text-red-500 text-sm mt-1">
          Please enter a valid username
        </div>
      </div>

      <div class="mb-4">
        <input
          type="password"
          formControlName="password"
          placeholder="Password"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-sm mt-1">
          Please enter your password
        </div>
      </div>
      <div *ngIf="errorMessage" class="text-red-600 mt-2">
        {{ errorMessage }}
      </div>      
      <div class="mb-4">
        <label class="inline-flex items-center text-gray-600">
          <input
            type="checkbox"
            [checked]="rememberMe"
            (change)="toggleRememberMe($event)"
            class="mr-2"
          />
          Remember My Login
        </label>
      </div>

      <div class="flex flex-col items-center sm:flex-row w-full gap-4 mb-6">
        <button
          type="submit"
          [disabled]="loading"
          class="w-full bg-[#009CD4] hover:bg-[#40aed5] text-white font-semibold px-4 py-2 rounded-md transition-all duration-300"
        >
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </div>
    </form>
  </div>
</div>
